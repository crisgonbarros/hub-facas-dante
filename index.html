      --carbon-2:   #161616;
      --carbon-3:   #1F1F1F;
      --carbon-4:   #2A2A2A;
      --ash:        #3A3A3A;
      --smoke:      #6B6B6B;
      --silver:     #A8A8A8;
      --white:      #F5F3EE;
      --white-dim:  #CFCDC8;
      --radius-sm:  4px;
      --radius-md:  8px;
      --radius-lg:  12px;
      --transition: 0.25s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      background: var(--carbon);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% 22%, rgba(201,168,76,0.16) 0%, transparent 70%),
        radial-gradient(ellipse 55% 35% at 85% 70%, rgba(201,168,76,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 35% at 10% 90%, rgba(201,168,76,0.08) 0%, transparent 65%);
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.25rem 2.5rem;
      display: flex; flex-direction: column; align-items: center;
    }

    /* HEADER */
    .hub-logo { width: 150px; max-width: 45vw; height: auto; margin: 0 auto 1.25rem; }
    .hub-tagline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-style: italic; color: var(--gold-light);
      text-align: center; letter-spacing: 0.02em;
    }
    .hub-label {
      margin-top: 0.9rem;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--gold); text-align: center;
    }
    .gold-rule {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-dim));
      margin: 1.75rem auto 2rem;
    }

    /* ENTRADA (somente opacity e transform, sem JS) */
    @keyframes rise {
      from { opacity: 0; transform: translate3d(0, 14px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .hub-tagline, .hub-label, .gold-rule, .link-card, footer {
      animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
      animation-delay: var(--d, 0s);
    }
    .hub-tagline { --d: 0.05s; }
    .hub-label   { --d: 0.12s; }
    .gold-rule   { --d: 0.18s; }
    .link-card:nth-child(1) { --d: 0.24s; --s: 1.6s; }
    .link-card:nth-child(2) { --d: 0.31s; --s: 1.9s; }
    .link-card:nth-child(3) { --d: 0.38s; --s: 2.2s; }
    .link-card:nth-child(4) { --d: 0.45s; --s: 2.5s; }
    .link-card:nth-child(5) { --d: 0.52s; --s: 2.8s; }
    .link-card:nth-child(6) { --d: 0.59s; --s: 3.1s; }
    footer { --d: 0.7s; }

    /* LINK CARDS (vidro) */
    .links { width: 100%; display: flex; flex-direction: column; gap: 0.9rem; }
    .link-card {
      position: relative; overflow: hidden; isolation: isolate;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.95rem 1.1rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--white);
      background: rgba(255,255,255,0.06);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 24px rgba(0,0,0,0.35);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), background-color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .link-card:hover, .link-card:focus-visible {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 14px 34px rgba(0,0,0,0.5);
      outline: none;
    }
    .link-card:active { transform: translateY(0); }

    /* reflexo: passa rapido e descansa, ciclo total de 4s */
    .link-card::after {
      content: ''; position: absolute; z-index: 1; pointer-events: none;
      top: -20%; bottom: -20%; left: 0; width: 45%;
      background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.22) 50%, transparent 100%);
      transform: translate3d(-160%, 0, 0) skewX(-20deg);
      animation: shine 4s ease-in-out infinite;
      animation-delay: var(--s, 2s);
      will-change: transform;
    }
    @keyframes shine {
      0%   { transform: translate3d(-160%, 0, 0) skewX(-20deg); }
      28%  { transform: translate3d(330%, 0, 0) skewX(-20deg); }
      100% { transform: translate3d(330%, 0, 0) skewX(-20deg); }
    }

    .lc-icon {
      flex: 0 0 46px; height: 46px;
      display: grid; place-items: center;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
    }
    .lc-icon svg { width: 24px; height: 24px; display: block; }
    .lc-text { flex: 1; min-width: 0; position: relative; z-index: 2; }
    .lc-title { display: block; font-size: 0.98rem; font-weight: 600; line-height: 1.3; color: var(--white); }
    .lc-sub { display: block; margin-top: 2px; font-size: 0.78rem; line-height: 1.4; color: rgba(245,243,238,0.72); }
    .lc-icon, .lc-arrow { position: relative; z-index: 2; }
    .lc-arrow { flex: 0 0 auto; opacity: 0.8; color: var(--white); }
    .lc-arrow svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Loja: vidro dourado */
    .card-loja {
      background: linear-gradient(135deg, rgba(201,168,76,0.34), rgba(201,168,76,0.14));
      border-color: rgba(226,201,126,0.6);
    }
    .card-loja .lc-icon { background: rgba(201,168,76,0.28); border-color: rgba(226,201,126,0.5); color: var(--gold-light); }
    .card-loja .lc-title { color: var(--gold-light); }
    .card-loja:hover, .card-loja:focus-visible { border-color: var(--gold-light); }

    /* Site institucional: vidro neutro com borda dourada */
    .card-site { border-color: rgba(201,168,76,0.4); }
    .card-site .lc-icon { color: var(--gold); border-color: rgba(201,168,76,0.35); }
    .card-site:hover, .card-site:focus-visible { border-color: var(--gold); }

    /* Instagram: vidro com o gradiente oficial */
    .card-instagram {
      background: linear-gradient(45deg, rgba(240,148,51,0.34), rgba(220,39,67,0.34) 50%, rgba(188,24,136,0.34));
      border-color: rgba(220,39,67,0.5);
    }
    .card-instagram .lc-icon { color: #fff; }

    /* Facebook: vidro azul oficial */
    .card-facebook { background: rgba(24,119,242,0.3); border-color: rgba(24,119,242,0.6); }
    .card-facebook .lc-icon { color: #fff; }

    /* TikTok: vidro escuro com realce ciano e magenta */
    .card-tiktok {
      background: rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), -2px 0 0 #25F4EE, 2px 0 0 #FE2C55, 0 8px 24px rgba(0,0,0,0.35);
    }
    .card-tiktok .lc-icon { color: #fff; }
    .card-tiktok .lc-icon svg { filter: drop-shadow(-1.5px -1px 0 #25F4EE) drop-shadow(1.5px 1px 0 #FE2C55); }
    .card-tiktok:hover, .card-tiktok:focus-visible {
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), -3px 0 0 #25F4EE, 3px 0 0 #FE2C55, 0 14px 34px rgba(0,0,0,0.5);
    }

    /* WhatsApp: vidro verde, texto claro para contraste */
    .card-whatsapp { background: rgba(37,211,102,0.24); border-color: rgba(37,211,102,0.6); }
    .card-whatsapp .lc-icon { background: rgba(37,211,102,0.3); border-color: rgba(37,211,102,0.55); color: #4be08a; }
    .card-whatsapp .lc-title { color: #fff; }
    .card-whatsapp .lc-sub { color: rgba(255,255,255,0.82); }

    /* FOOTER */
    footer { margin-top: 2.75rem; text-align: center; }
    .footer-logo { height: 40px; width: auto; margin: 0 auto 0.9rem; opacity: 0.95; }
    footer p { font-size: 0.75rem; color: var(--smoke); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .link-card::after { display: none; }
    }
  </style>
</head>
